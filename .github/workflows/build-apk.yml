name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Your live site address (https://your-shop.netlify.app). Leave empty to use the SITE_URL repository variable."
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Capacitor
        run: npm install
      - name: Write app config
        run: node make-config.js
      - name: Create Android project
        run: npx cap add android
      - name: Apply MJ's Printing icons
        run: cp -r android-res/* android/app/src/main/res/
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MJs-Printing.apk
      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MJ's Printing app (APK) #${{ github.run_number }}
          body: "Download **MJs-Printing.apk** below, open it on your Android phone and tap Install (allow “Install unknown apps” if asked)."
          files: android-app/MJs-Printing.apk
          make_latest: true
